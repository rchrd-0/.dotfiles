config-version = 2

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 16

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  '~/.local/bin/aerospace-follow-utils.sh "cc.ffitch.shottr" "com.raycast.macos"',
]

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4"]

on-mode-changed = []

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

alt-shift-h = 'focus left --boundaries-action wrap-around-the-workspace'
alt-shift-j = 'focus down --boundaries-action wrap-around-the-workspace'
alt-shift-k = 'focus up --boundaries-action wrap-around-the-workspace'
alt-shift-l = 'focus right --boundaries-action wrap-around-the-workspace'

shift-cmd-h = 'move left'
shift-cmd-j = 'move down'
shift-cmd-k = 'move up'
shift-cmd-l = 'move right'

alt-shift-a = 'join-with left'
alt-shift-d = 'join-with right'
alt-shift-w = 'join-with up'
alt-shift-s = 'join-with down'

alt-shift-period = 'layout tiles horizontal vertical'
alt-shift-comma = 'layout accordion horizontal vertical'
alt-shift-enter = 'fullscreen'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'
alt-shift-0 = 'balance-sizes'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
# alt-q = 'workspace Q'
# alt-z = 'workspace Z'
alt-backtick = 'workspace "`"'
alt-n = 'workspace next --wrap-around'
alt-p = 'workspace prev --wrap-around'

alt-shift-1 = ['move-node-to-workspace 1']
alt-shift-2 = ['move-node-to-workspace 2']
alt-shift-3 = ['move-node-to-workspace 3']
alt-shift-4 = ['move-node-to-workspace 4']
alt-shift-5 = ['move-node-to-workspace 5']
# alt-shift-q = ['move-node-to-workspace Q']
# alt-shift-z = ['move-node-to-workspace Z']
alt-shift-backtick = ['move-node-to-workspace "`"']
alt-shift-n = ['move-node-to-workspace next --wrap-around']
alt-shift-p = ['move-node-to-workspace prev --wrap-around']

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'
alt-shift-m = 'mode manage'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
tab = ['enable toggle']
shift-backspace = ['close-all-windows-but-current', 'mode main']

[mode.manage.binding]
esc = 'mode main'
h = ['move left']
j = ['move down']
k = ['move up']
l = ['move right']
w = ['join-with up']
d = ['join-with right']
a = ['join-with left']
s = ['join-with down']
alt-h = ['focus left --boundaries-action wrap-around-the-workspace']
alt-j = ['focus down --boundaries-action wrap-around-the-workspace']
alt-k = ['focus up --boundaries-action wrap-around-the-workspace']
alt-l = ['focus right --boundaries-action wrap-around-the-workspace']
period = ['layout tiles horizontal vertical']
comma = ['layout accordion horizontal vertical']
enter = 'fullscreen'
minus = 'resize smart -50'
equal = 'resize smart +50'
shift-minus = 'resize smart-opposite -50'
shift-equal = 'resize smart-opposite +50'
0 = 'balance-sizes'
1 = 'workspace 1'
2 = 'workspace 2'
3 = 'workspace 3'
4 = 'workspace 4'
5 = 'workspace 5'
shift-1 = ['move-node-to-workspace 1']
shift-2 = ['move-node-to-workspace 2']
shift-3 = ['move-node-to-workspace 3']
shift-4 = ['move-node-to-workspace 4']
shift-5 = ['move-node-to-workspace 5']
alt-shift-backtick = ['move-node-to-workspace "`"']

[workspace-to-monitor-force-assignment]
'`' = ['secondary']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = [
  'layout tiling',
  # 'move-node-to-workspace 1'
]

[[on-window-detected]]
if.app-id = 'com.linear'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.tinyapp.TablePlus'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'org.qbittorrent.qBittorrent'
# run = 'move-node-to-workspace 4'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
# run = ['layout floating', 'move-node-to-workspace 4']
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.aone.keka'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = [
  'layout floating',
  # 'move-node-to-workspace 4'
]

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-EventViewer'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.colliderli.iina'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '^mpv$'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.nordvpn.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'cc.ffitch.shottr'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.logi.ghub'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.FontBook'
run = 'layout floating'


[[on-window-detected]]
if.app-id = 'com.daisydiskapp.DaisyDiskStandAlone'
run = 'layout floating'
