# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#ebbcba" # rose
      - "bold"
    inactiveBorderColor:
      - "#9ccfd8" # foam
    searchingActiveBorderColor:
      - "#ebbcba" # rose
      - "bold"
    optionsTextColor:
      - "#c4a7e7" # iris
    selectedLineBgColor:
      - "#26233a" # highlight med
    cherryPickedCommitFgColor:
      - "#c4a7e7" # iris
    cherryPickedCommitBgColor:
      - "#f6c177" # gold
    markedBaseCommitFgColor:
      - "#c4a7e7" # iris
    markedBaseCommitBgColor:
      - "#f6c177" # gold
    unstagedChangesColor:
      - "#eb6f92" # love
    defaultFgColor:
      - "#e0def4" # text
git:
  diffRenderers:
    - command: delta --paging=never --line-numbers
      name: delta

    - type: rawGit
      name: raw
customCommands:
  - key: '<ctrl+g>'
    context: files
    description: Generate AI commit message and copy to clipboard
    command: >-
      message="$(ai-commit-message)" &&
      printf '%s' "$message" | pbcopy &&
      printf '%s\n\nCopied to clipboard. Close this popup, press c, and paste to review.\n' "$message"
    loadingText: Generating AI commit message
    output: popup
    outputTitle: AI commit message ready
