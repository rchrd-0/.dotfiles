#:schema https://mise.jdx.dev/schema/mise.json

[tools]
# runtimes / tooling
node = { version = "24", corepack = true }
bun = "1.4"
deno = "2"
nub = { version = "latest", allow_builds = ["@nubjs/nub"] }

# languages
ruby = "3.3.5"
go = "1.26.4"
python = "3.12"
java = "zulu-17"

# BEAM - paired
erlang = "28.3.1"
elixir = "1.19.5-otp-28"

# authoring, editor tooling etc
typst = "latest"
"aqua:neovim/neovim" = "0.12.3"

# dev utils
usage = "latest"
uv = "latest"
herdr = "latest"
hunk = "latest"

# cloud and service clis
bitwarden = "latest"
bitwarden-secrets-manager = "latest"
neonctl = "latest"
turso = "latest"
wrangler = "latest"
flyctl = "latest"
aws = { version = "latest", symlink_bins = "true" }
railway = "latest"
doctl = "latest"

[tool_alias]
render = "github:render-oss/cli"
tuicr = "github:agavra/tuicr"

[tools.tuicr]
version = "latest"

[tools.render]
version = "latest"
rename_exe = { "cli_v*" = "render" }

[settings]
idiomatic_version_file_enable_tools = ["node", "python", "bun"]
lockfile_platforms = ["macos-arm64"]
minimum_release_age = "3d"

[settings.python]
uv_venv_auto = "source"
